version: '3.9'

networks:
  cegx_net:
    driver: bridge

services:
  cegx_db:
    image: postgres:16-alpine
    container_name: cegx_db
    restart: always
    networks:
      - cegx_net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cegx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cegxpass}
      POSTGRES_DB: ${POSTGRES_DB:-cegx}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cegx}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cegx_redis
    restart: always
    networks:
      - cegx_net
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cegx_backend
    restart: always
    networks:
      - cegx_net
    depends_on:
      cegx_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cegx}:${POSTGRES_PASSWORD:-cegxpass}@cegx_db:5432/${POSTGRES_DB:-cegx}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-changeme-jwt-secret-min-32-chars!!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-changeme-refresh-secret-min-32chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      GROK_API_KEY: ${GROK_API_KEY:-}
      GROK_MODEL: ${GROK_MODEL:-grok-3}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cegx.co.uk}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123456}
      PORT: 3003
      NODE_ENV: production
      CORS_ORIGIN: ${FRONTEND_URL:-http://localhost:3002}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3002}
      APP_URL: ${APP_URL:-http://localhost:3003}
    ports:
      - '3003:3003'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3003/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cegx_frontend
    restart: always
    networks:
      - cegx_net
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3003/api}
      INTERNAL_API_URL: http://backend:3003/api
    ports:
      - '3002:3002'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3002 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
